[pytest]
testpaths = tests
markers =
    real_license: giữ nguyên core.license.require_active (không giả lập là đã kích hoạt)
    real_monitors: giữ nguyên core.monitors.list_monitors/game_monitor (không giả lập một màn hình 1920x1080)
pythonpath = .
filterwarnings =
    # mss.mss() đã deprecated từ mss 10.2.0 (dùng mss.MSS()). Mọi cảnh báo deprecated nhắc tới mss đều là lỗi.
    error:.*\bmss\b.*is deprecated:DeprecationWarning
